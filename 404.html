<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — L'Art du Service Client</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/jpeg" href="images/Logo_1.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Plus+Jakarta+Sans:wght@0,400;0,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F5F0E8;
      --title: #0a0a0a;
      --muted: rgba(0,0,0,0.45);
      --line: rgba(0,0,0,0.1);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--cream);
      color: var(--title);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      text-align: center;
    }

    .code {
      font-family: var(--serif);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 300;
      font-style: italic;
      line-height: 1;
      color: rgba(0,0,0,0.08);
      letter-spacing: -0.04em;
      user-select: none;
    }

    .title {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-top: 1.5rem;
      margin-bottom: 1rem;
    }

    .sub {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.8;
      max-width: 380px;
      margin-bottom: 3rem;
    }

    .divider {
      width: 32px;
      height: 1px;
      background: var(--line);
      margin: 0 auto 3rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      background: var(--title);
      color: #fff;
      text-decoration: none;
      font-family: var(--sans);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 1rem 2.5rem;
      transition: background 0.3s, color 0.3s;
    }
    .btn:hover { background: transparent; color: var(--title); outline: 1px solid var(--title); }
  </style>
</head>
<body>
  <p class="code">404</p>
  <h1 class="title">Cette page s'est évaporée.</h1>
  <p class="sub">Comme un effluve trop fugace — elle n'est plus là. Mais l'essentiel, lui, reste.</p>
  <div class="divider"></div>
  <a href="/" class="btn">Revenir à l'accueil →</a>
</body>
</html>
